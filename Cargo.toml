# l-parquet — Apache Parquet reader/writer for L, loaded via `2:`.
# cdylib only: the L host binary dlopens the library; the host ABI symbols
# (ktn, sn, ...) resolve against the host process at load time.
[package]
name = "l-parquet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Apache Parquet reader/writer for L (bind via 2:)"

[lib]
name = "l_parquet"
crate-type = ["cdylib"]

[dependencies]
# arrow-rs does all Parquet format work; matching major versions required.
#
# PINNED to 55.2.x, and not as caution about the API.  read.rs decodes
# fixed-width columns into a Vec built over the HOST's memory, and what
# makes that sound is an INTERNAL invariant of these two crates that no
# API change has to announce — `raw_col` in src/read.rs states it in
# full.  A version bump is a deliberate act that re-reads `raw_col`.
arrow = "=55.2"
parquet = { version = "=55.2", features = ["arrow", "zstd", "snap", "lz4"] }
# Profiling only, and only when asked for: see [features] below.
hotpath = { version = "0.23", optional = true, default-features = false }

[features]
# `--features hotpath` turns the `hp!` guards and the `#[cfg_attr(...,
# hotpath::measure)]` annotations into live per-function timing, printed
# when the entry point returns; `hotpath-alloc` adds allocation bytes.
# The default build has neither the dependency nor the code.
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[profile.release]
lto = true              # single cdylib: cross-crate inlining pays for itself
codegen-units = 1       # smaller, faster code; build time is irrelevant here
